<figure class="chart"><svg viewBox="0 0 680 140" width="100%" role="img" aria-label="黎曼猜想 Lean 證明的驗證關卡" font-family="system-ui,-apple-system,Segoe UI,sans-serif" style="max-width:680px;height:auto"><defs><marker id="ah14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect x="0" y="30" width="152" height="84" rx="6" fill="#d9f2e6" stroke="#c3c2b7"/><text x="76.0" y="60.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">第一關</text><text x="76.0" y="76.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="400">程式碼編得過</text><text x="76.0" y="92.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="400">多位數學家回報通過</text><rect x="176" y="30" width="152" height="84" rx="6" fill="#d9f2e6" stroke="#c3c2b7"/><text x="252.0" y="60.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">第二關</text><text x="252.0" y="76.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="400">命題就是黎曼猜想</text><text x="252.0" y="92.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="400">有人確認是廣義版</text><rect x="352" y="30" width="152" height="84" rx="6" fill="#fff4d6" stroke="#c3c2b7"/><text x="428.0" y="60.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">第三關</text><text x="428.0" y="76.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="400">公理稽核、人能讀懂</text><text x="428.0" y="92.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="400">進行中</text><rect x="528" y="30" width="152" height="84" rx="6" fill="#eef0ec" stroke="#c3c2b7"/><text x="604.0" y="60.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">克雷認定</text><text x="604.0" y="76.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="400">發表後至少兩年</text><text x="604.0" y="92.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="400">尚未開始計