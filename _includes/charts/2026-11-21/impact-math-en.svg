<figure class="chart"><svg viewBox="0 0 680 211" width="100%" role="img" aria-label="Short, medium and long-term effects on mathematics" font-family="system-ui,-apple-system,Segoe UI,sans-serif" style="max-width:680px;height:auto"><rect x="0.0" y="8" width="220.0" height="199" rx="6" fill="#e4effc" stroke="#c3c2b7"/><text x="12.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Short term</text><text x="12.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Next three months</text><text x="12.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Three checks</text><text x="12.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Independent Lean rebuild, axioms</text><text x="12.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Navier-Stokes certificate out</text><text x="12.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Open review of Masullo&#x27;s draft</text><text x="12.0" y="148.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="12.0" y="167.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">How I read it</text><text x="12.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">All three remain claims</text><rect x="230.0" y="8" width="220.0" height="199" rx="6" fill="#fff4d6" stroke="#c3c2b7"/><text x="242.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Medium term</text><text x="242.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Three months to two years</text><text x="242.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">If it holds</text><text x="242.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Hundreds of conditional results</text><text x="242.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">become unconditional</text><text x="242.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Lean becomes the delivery norm</text><text x="242.0" y="148.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="242.0" y="167.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Either way</text><text x="242.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Credit and priority rules change</text><rect x="460.0" y="8" width="220.0" height="199" rx="6" fill="#eef0ec" stroke="#c3c2b7"/><text x="472.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Long term</text><text x="472.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Beyond two years</text><text x="472.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">The work moves</text><text x="472.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">From proving it first</text><text x="472.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">to choosing, digesting, explaining</text><text x="472.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="472.0" y="148.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">The risk</text><text x="472.0" y="167.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Theorems nobody can read pile up</text><text x="472.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">and are hard to build on</text></svg></figure>
