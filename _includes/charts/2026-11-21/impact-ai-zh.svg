<figure class="chart"><svg viewBox="0 0 680 211" width="100%" role="img" aria-label="對 AI 科技的短中長期影響" font-family="system-ui,-apple-system,Segoe UI,sans-serif" style="max-width:680px;height:auto"><rect x="0.0" y="8" width="220.0" height="199" rx="6" fill="#e4effc" stroke="#c3c2b7"/><text x="12.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">短期</text><text x="12.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">未來三個月</text><text x="12.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">展示競賽升溫</text><text x="12.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">各家拿難題當模型的廣告</text><text x="12.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">公告都是利害關係方的說法</text><text x="12.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="12.0" y="148.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">算力</text><text x="12.0" y="167.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">長時間、多 agent 的推論</text><text x="12.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">token 用量未揭露，無法換算</text><rect x="230.0" y="8" width="220.0" height="199" rx="6" fill="#fff4d6" stroke="#c3c2b7"/><text x="242.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">中期</text><text x="242.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">三個月到兩年</text><text x="242.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">生成加形式驗證往外擴</text><text x="242.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">軟體正確性、晶片設計驗證</text><text x="242.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">（我的推論，尚無數據）</text><text x="242.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="242.0" y="148.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">資料治理</text><text x="242.0" y="167.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">未公開的研究有沒有進訓練</text><text x="242.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">會變成企業合約的條款</text><rect x="460.0" y="8" width="220.0" height="199" rx="6" fill="#eef0ec" stroke="#c3c2b7"/><text x="472.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">長期</text><text x="472.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">兩年以上</text><text x="472.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">AI 成為研究的產出者</text><text x="472.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">但數學的驗證成本最低</text><text x="472.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">藥物、材料仍卡在實驗</text><text x="472.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="472.0" y="148.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">資安</text><text x="472.0" y="167.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">不會因此破解 RSA</text><text x="472.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">真正的威脅仍是量子電腦</text></svg></figure>
