<figure class="chart"><svg viewBox="0 0 680 574" width="100%" role="img" aria-label="2026 年 7 月到 11 月的事件時間線" font-family="system-ui,-apple-system,Segoe UI,sans-serif" style="max-width:680px;height:auto"><circle cx="26" cy="14" r="6" fill="#2a78d6"/><text x="38.0" y="18.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Alpöge／Anthropic</text><circle cx="164.8" cy="14" r="6" fill="#eb6834"/><text x="176.8" y="18.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">OpenAI</text><circle cx="235.60000000000002" cy="14" r="6" fill="#1baf7a"/><text x="247.6" y="18.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">學界</text><circle cx="290.6" cy="14" r="6" fill="#eda100"/><text x="302.6" y="18.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">市場</text><line x1="104" x2="104" y1="40" y2="548" stroke="#c3c2b7" stroke-width="2"/><text x="88.0" y="54.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">7/19</text><circle cx="104" cy="50" r="6.5" fill="#2a78d6" stroke="#fff" stroke-width="2"><title>7/19 Alpöge 用 Claude 提出 Jacobian 猜想的反例</title></circle><text x="122.0" y="54.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Alpöge 用 Claude 提出 Jacobian 猜想的反例</text><text x="88.0" y="98.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">8 月</text><circle cx="104" cy="94" r="6.5" fill="#2a78d6" stroke="#fff" stroke-width="2"><title>8 月 Claude 把「已證明在臨界線上的零點比例」從 41.6% 推到 67.2%</title></circle><text x="122.0" y="98.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Claude 把「已證明在臨界線上的零點比例」從 41.6% 推到 67.2%</text><text x="122.0" y="114.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">當時 Anthropic 自己說這不是黎曼猜想的證明</text><text x="88.0" y="142.0" font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600">8/15</text><circle cx="104" cy="138" r="6.5" fill="#2a78d6" stroke="#fff" stroke-width="2"><title>8/15 Buc