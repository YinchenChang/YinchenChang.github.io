<figure class="chart"><svg viewBox="0 0 680 211" width="100%" role="img" aria-label="Short, medium and long-term effects on AI technology" font-family="system-ui,-apple-system,Segoe UI,sans-serif" style="max-width:680px;height:auto"><rect x="0.0" y="8" width="220.0" height="199" rx="6" fill="#e4effc" stroke="#c3c2b7"/><text x="12.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Short term</text><text x="12.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Next three months</text><text x="12.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">The showcase race heats up</text><text x="12.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Hard problems as model adverts</text><text x="12.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Read announcements as interested</text><text x="12.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="12.0" y="148.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Compute</text><text x="12.0" y="167.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Long multi-agent inference runs</text><text x="12.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Token use undisclosed</text><rect x="230.0" y="8" width="220.0" height="199" rx="6" fill="#fff4d6" stroke="#c3c2b7"/><text x="242.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Medium term</text><text x="242.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Three months to two years</text><text x="242.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Generate, then formally verify</text><text x="242.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Software and chip verification</text><text x="242.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">(my inference, no data yet)</text><text x="242.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="242.0" y="148.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Data governance</text><text x="242.0" y="167.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Did unpublished work reach</text><text x="242.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">training? A contract term now</text><rect x="460.0" y="8" width="220.0" height="199" rx="6" fill="#eef0ec" stroke="#c3c2b7"/><text x="472.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Long term</text><text x="472.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Beyond two years</text><text x="472.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">AI as a producer of research</text><text x="472.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">But math is cheapest to verify</text><text x="472.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Drugs, materials still need labs</text><text x="472.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="472.0" y="148.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Security</text><text x="472.0" y="167.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">This does not break RSA</text><text x="472.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Quantum remains the threat</text></svg></figure>
