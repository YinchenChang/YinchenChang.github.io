<figure class="chart"><svg viewBox="0 0 680 211" width="100%" role="img" aria-label="對數學的短中長期影響" font-family="system-ui,-apple-system,Segoe UI,sans-serif" style="max-width:680px;height:auto"><rect x="0.0" y="8" width="220.0" height="199" rx="6" fill="#e4effc" stroke="#c3c2b7"/><text x="12.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">短期</text><text x="12.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">未來三個月</text><text x="12.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">驗證三件事</text><text x="12.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Lean 獨立重建與公理稽核</text><text x="12.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">納維-斯托克斯數值憑證公開</text><text x="12.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Masullo 草稿的公開審查</text><text x="12.0" y="148.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="12.0" y="167.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">我會怎麼讀</text><text x="12.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">三份都當「宣稱」處理</text><rect x="230.0" y="8" width="220.0" height="199" rx="6" fill="#fff4d6" stroke="#c3c2b7"/><text x="242.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">中期</text><text x="242.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">三個月到兩年</text><text x="242.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">若成立</text><text x="242.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">數百個條件式定理轉為無條件</text><text x="242.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Lean 變成交付證明的標準</text><text x="242.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="242.0" y="148.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">不論成立與否</text><text x="242.0" y="167.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">署名與優先權的規則要重寫</text><text x="242.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">克雷的兩年等待開始計時</text><rect x="460.0" y="8" width="220.0" height="199" rx="6" fill="#eef0ec" stroke="#c3c2b7"/><text x="472.0" y="30.0" font-size="13.5" fill="#0b0b0b" text-anchor="start" font-weight="700">長期</text><text x="472.0" y="47.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">兩年以上</text><text x="472.0" y="72.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">工作內容移動</text><text x="472.0" y="91.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">從搶先證出來</text><text x="472.0" y="110.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">移到挑問題、讀懂、講清楚</text><text x="472.0" y="129.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400"></text><text x="472.0" y="148.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">風險</text><text x="472.0" y="167.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">沒有人讀得懂的定理越積越多</text><text x="472.0" y="186.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">後人難以在上面繼續蓋</text></svg></figure>
