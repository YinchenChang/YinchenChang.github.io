{%- assign posts = site.posts | where: "lang", include.lang -%}
<ul class="post-index">
{%- for post in posts limit: include.limit %}
  <li><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
    <div><a href="{{ post.url | relative_url }}">{{ post.title }}</a><span data-new="{{ post.date | date: '%Y-%m-%d' }}"></span>
    {%- if post.description %}<p>{{ post.description }}</p>{% endif %}</div></li>
{%- endfor %}
</ul>
